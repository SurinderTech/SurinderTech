<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="My Ninja Way — What I Build">
<title>My Ninja Way — SurinderTech</title>
<defs>
<style>
.bg{fill:#050a14}
.head{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:28px;fill:url(#hG)}
.sub{font-family:'JetBrains Mono',monospace;font-size:12px;fill:#475569;letter-spacing:3px}
.card{fill:#0a1628;stroke:#1e3a5f;stroke-width:1}
.ctitle{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;fill:#e2e8f0}
.cdesc{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:#94a3b8;line-height:1.5}
.icon{font-size:22px}
.cardIn{opacity:0;animation:slideUp 0.6s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes borderFlow{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px currentColor)}50%{filter:drop-shadow(0 0 12px currentColor)}}
</style>
<linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
<stop offset="0%" stop-color="#020917"/><stop offset="100%" stop-color="#030c1a"/>
</linearGradient>
<linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/>
</linearGradient>
<linearGradient id="lineG" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#1e40af" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
</linearGradient>
<linearGradient id="a1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
<linearGradient id="a2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2d1b69"/><stop offset="100%" stop-color="#150d35"/></linearGradient>
<linearGradient id="a3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#064e3b"/><stop offset="100%" stop-color="#022c22"/></linearGradient>
<linearGradient id="a4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c2d12"/><stop offset="100%" stop-color="#3c1206"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1280" height="320" fill="url(#bgG)"/>
<!-- Grid -->
<g opacity="0.03" stroke="#38bdf8" stroke-width="0.5">
<line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="240" x2="1280" y2="240"/>
<line x1="256" y1="0" x2="256" y2="320"/><line x1="512" y1="0" x2="512" y2="320"/><line x1="768" y1="0" x2="768" y2="320"/><line x1="1024" y1="0" x2="1024" y2="320"/>
</g>

<!-- Header -->
<text x="640" y="46" text-anchor="middle" class="sub">// MY NINJA WAY</text>
<text x="640" y="82" text-anchor="middle" class="head" filter="url(#glow)">What I Build &amp; Why I Build It</text>
<line x1="140" y1="96" x2="1140" y2="96" stroke="url(#lineG)" stroke-width="1.5" stroke-dasharray="1000" stroke-dashoffset="1000" style="animation:borderFlow 1.4s ease 0.3s both"/>

<!-- Card 1: AI Engineering -->
<g class="cardIn" style="animation-delay:0.2s">
<rect x="40" y="118" width="280" height="168" rx="10" fill="url(#a1)" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="40" y="118" width="280" height="4" rx="2" fill="#3b82f6"/>
<text x="80" y="156" class="icon">🤖</text>
<text x="110" y="157" class="ctitle" fill="#93c5fd">AI Engineering</text>
<text x="56" y="180" class="cdesc">LLMs · AI Agents · RAG pipelines</text>
<text x="56" y="197" class="cdesc">Intelligent automation systems</text>
<text x="56" y="214" class="cdesc">Agentic workflows with n8n</text>
<text x="56" y="231" class="cdesc">HuggingFace · LangChain · OpenAI</text>
<text x="56" y="258" font-family="'JetBrains Mono',monospace" font-size="9" fill="#1d4ed8">AI_RANK: S-CLASS ◆</text>
</g>

<!-- Card 2: Full-Stack -->
<g class="cardIn" style="animation-delay:0.35s">
<rect x="340" y="118" width="280" height="168" rx="10" fill="url(#a2)" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="340" y="118" width="280" height="4" rx="2" fill="#8b5cf6"/>
<text x="380" y="156" class="icon">💻</text>
<text x="410" y="157" class="ctitle" fill="#c4b5fd">Full-Stack Dev</text>
<text x="356" y="180" class="cdesc">React · Next.js · TypeScript</text>
<text x="356" y="197" class="cdesc">FastAPI · Node.js · REST/GraphQL</text>
<text x="356" y="214" class="cdesc">PostgreSQL · MongoDB · Supabase</text>
<text x="356" y="231" class="cdesc">Scalable, production-ready systems</text>
<text x="356" y="258" font-family="'JetBrains Mono',monospace" font-size="9" fill="#6d28d9">STACK_RANK: S-CLASS ◆</text>
</g>

<!-- Card 3: Product Building -->
<g class="cardIn" style="animation-delay:0.5s">
<rect x="640" y="118" width="280" height="168" rx="10" fill="url(#a3)" stroke="#16a34a" stroke-width="1.5"/>
<rect x="640" y="118" width="280" height="4" rx="2" fill="#22c55e"/>
<text x="680" y="156" class="icon">🚀</text>
<text x="710" y="157" class="ctitle" fill="#86efac">Product Builder</text>
<text x="656" y="180" class="cdesc">Zero → One product development</text>
<text x="656" y="197" class="cdesc">GrowthOS · InterviewAI</text>
<text x="656" y="214" class="cdesc">User-centric design thinking</text>
<text x="656" y="231" class="cdesc">Ship fast · iterate · scale</text>
<text x="656" y="258" font-family="'JetBrains Mono',monospace" font-size="9" fill="#15803d">BUILD_RANK: S-CLASS ◆</text>
</g>

<!-- Card 4: DevOps/Cloud -->
<g class="cardIn" style="animation-delay:0.65s">
<rect x="940" y="118" width="300" height="168" rx="10" fill="url(#a4)" stroke="#dc2626" stroke-width="1.5"/>
<rect x="940" y="118" width="300" height="4" rx="2" fill="#ef4444"/>
<text x="980" y="156" class="icon">☁️</text>
<text x="1010" y="157" class="ctitle" fill="#fca5a5">Cloud &amp; DevOps</text>
<text x="956" y="180" class="cdesc">AWS · GCP · Docker · Kubernetes</text>
<text x="956" y="197" class="cdesc">CI/CD pipelines · Linux systems</text>
<text x="956" y="214" class="cdesc">Nginx · Vercel · Supabase</text>
<text x="956" y="231" class="cdesc">Scalable infrastructure design</text>
<text x="956" y="258" font-family="'JetBrains Mono',monospace" font-size="9" fill="#991b1b">OPS_RANK: A-CLASS ◆</text>
</g>

<!-- Bottom quote -->
<text x="640" y="306" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#334155" font-style="italic">"Think Beyond Code 🚀 — Build. Automate. Scale. Create Impact."</text>
</svg>

